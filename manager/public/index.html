<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沿昭知识库管理器</title><link rel="stylesheet" href="manager.css"></head><body><header><div><strong>沿昭知识库管理器</strong><span id="saveState">已读取本地内容</span></div><nav><a href="/" target="_blank">预览网站</a><button id="saveButton">保存</button><button class="publish" id="publishButton">一键发布</button></nav></header><main><aside><div class="panel-title"><b>目录</b><button id="addSection">＋</button></div><div id="sections"></div></aside><section class="articles"><div class="panel-title"><b id="articleHeading">文章</b><button id="addArticle">＋ 新建</button></div><div id="articles"></div></section><section class="editor"><div id="emptyEditor" class="empty">选择一篇文章开始编辑，或点击“新建”。</div><form id="editorForm" hidden><label>文章标题<input id="title" required></label><label>所属目录<select id="sectionId"></select></label><label>摘要<textarea id="summary" rows="2"></textarea></label><label>正文（支持Markdown）<textarea id="body" class="body" rows="20" placeholder="# 一级标题&#10;&#10;在这里输入正文……"></textarea></label><div class="attachment"><label>添加附件<input type="file" id="fileInput"></label><span id="uploadState">支持PDF、Word、Excel、图片，单个不超过25MB</span></div><button type="button" class="danger" id="deleteArticle">删除这篇文章</button></form></section></main><div class="toast" id="toast"></div><script src="manager.js"></script></body></html>
